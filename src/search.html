<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Search - Search Interface</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .source-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .source-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .badge-custom {
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
        }
        
        .config-section {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        
        .response-section {
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="card shadow-lg mb-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h1 class="mb-2">
                            <i class="bi bi-search gradient-text"></i>
                            <span class="gradient-text">AI Search</span>
                        </h1>
                        <p class="text-muted mb-0">Intelligent search with AI-powered responses</p>
                    </div>
                    <a href="/db-manager" class="btn btn-outline-primary">
                        <i class="bi bi-database"></i> Database Manager
                    </a>
                </div>
            </div>
        </div>

        <!-- API Configuration -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <label for="apiUrl" class="form-label fw-semibold">
                    <i class="bi bi-server"></i> API URL
                </label>
                <input type="text" id="apiUrl" class="form-control" value="http://localhost:8000" placeholder="http://localhost:8000">
            </div>
        </div>

        <!-- Search Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">
                    <i class="bi bi-search"></i> Search Query
                </h5>
                
                <form id="searchForm" onsubmit="executeSearch(event)">
                    <!-- Query Input -->
                    <div class="mb-3">
                        <label for="query" class="form-label fw-semibold">Query</label>
                        <textarea 
                            id="query" 
                            class="form-control" 
                            rows="3" 
                            placeholder="Enter your search query..."
                            required
                        ></textarea>
                    </div>

                    <!-- Configuration Section -->
                    <div class="config-section mb-3">
                        <h6 class="mb-3">
                            <i class="bi bi-gear"></i> Configuration
                        </h6>
                        
                        <div class="row g-3">
                            <!-- Search Mode -->
                            <div class="col-md-3">
                                <label for="searchMode" class="form-label">Search Mode</label>
                                <select id="searchMode" class="form-select">
                                    <option value="hybrid" selected>Hybrid</option>
                                    <option value="local">Local Only</option>
                                    <option value="web">Web Only</option>
                                </select>
                            </div>

                            <!-- Language -->
                            <div class="col-md-3">
                                <label for="language" class="form-label">Language</label>
                                <select id="language" class="form-select">
                                    <option value="auto" selected>Auto</option>
                                    <option value="en">English</option>
                                    <option value="cs">Czech</option>
                                    <option value="sk">Slovak</option>
                                </select>
                            </div>

                            <!-- Use Local DB -->
                            <div class="col-md-3">
                                <label class="form-label">Local Database</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="useLocalDb" checked>
                                    <label class="form-check-label" for="useLocalDb">
                                        Use Local DB
                                    </label>
                                </div>
                            </div>

                            <!-- Internal Mode -->
                            <div class="col-md-3">
                                <label class="form-label">Response Mode</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="internalMode">
                                    <label class="form-check-label" for="internalMode">
                                        Raw Results
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Document Upload (Optional) -->
                    <div class="mb-3">
                        <label for="documents" class="form-label">
                            <i class="bi bi-file-earmark-plus"></i> Optional Documents
                        </label>
                        <input 
                            type="file" 
                            id="documents" 
                            class="form-control" 
                            multiple 
                            accept=".txt,.md,.json"
                        >
                        <div class="form-text">Upload documents to include in search context (TXT, MD, JSON)</div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="searchBtn">
                        <i class="bi bi-search"></i> Search
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsContainer"></div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let API_BASE_URL = 'http://localhost:8000';

        // Update API URL when changed
        document.getElementById('apiUrl').addEventListener('change', (e) => {
            API_BASE_URL = e.target.value.replace(/\/$/, '');
        });

        // Execute search
        async function executeSearch(event) {
            event.preventDefault();
            
            const searchBtn = document.getElementById('searchBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            
            // Get form values
            const query = document.getElementById('query').value.trim();
            const searchMode = document.getElementById('searchMode').value;
            const language = document.getElementById('language').value;
            const useLocalDb = document.getElementById('useLocalDb').checked;
            const internalMode = document.getElementById('internalMode').checked;
            const documentsInput = document.getElementById('documents');
            
            // Disable button and show loading
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Searching...';
            
            resultsContainer.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body text-center p-5">
                        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
                        <h5>Searching...</h5>
                        <p class="text-muted mb-0">Processing your query with AI</p>
                    </div>
                </div>
            `;

            try {
                // Process documents if any
                const documents = [];
                if (documentsInput.files.length > 0) {
                    for (const file of documentsInput.files) {
                        const content = await readFileAsText(file);
                        const base64Content = btoa(unescape(encodeURIComponent(content)));
                        documents.push({
                            filename: file.name,
                            content: base64Content
                        });
                    }
                }

                // Build request body
                const requestBody = {
                    query: query,
                    search_mode: searchMode,
                    language: language,
                    use_local_db: useLocalDb,
                    internal_mode: internalMode
                };

                if (documents.length > 0) {
                    requestBody.documents = documents;
                }

                // Make API request
                const response = await fetch(`${API_BASE_URL}/api/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                displayResults(result);

            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = `
                    <div class="alert alert-danger shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <strong>Search Failed</strong><br>
                        ${escapeHtml(error.message)}
                    </div>
                `;
            } finally {
                // Re-enable button
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="bi bi-search"></i> Search';
            }
        }

        // Display search results
        function displayResults(result) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (!result.success) {
                resultsContainer.innerHTML = `
                    <div class="alert alert-warning shadow-sm" role="alert">
                        <i class="bi bi-info-circle-fill"></i>
                        <strong>No Results</strong><br>
                        ${escapeHtml(result.message || 'No results found for your query')}
                    </div>
                `;
                return;
            }

            let html = '<div class="response-section">';

            // AI Response (if not internal mode)
            if (result.summary) {
                html += `
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-stars text-primary"></i> AI Summary
                            </h5>
                            ${result.confidence ? `
                                <span class="badge ${getConfidenceBadgeClass(result.confidence)} mb-3">
                                    Confidence: ${escapeHtml(result.confidence)}
                                </span>
                            ` : ''}
                            <p class="card-text">${escapeHtml(result.summary)}</p>
                        </div>
                    </div>
                `;
            }

            // Key Points
            if (result.key_points && result.key_points.length > 0) {
                html += `
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-list-check text-success"></i> Key Points
                            </h5>
                            <ul class="list-group list-group-flush">
                                ${result.key_points.map(point => `
                                    <li class="list-group-item">
                                        <i class="bi bi-check-circle text-success me-2"></i>
                                        ${escapeHtml(point)}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            }

            // Sources
            if (result.sources && result.sources.length > 0) {
                html += `
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">
                                <i class="bi bi-link-45deg text-info"></i> Sources
                                <span class="badge bg-secondary">${result.sources.length}</span>
                            </h5>
                            <div class="row g-3">
                                ${result.sources.map((source, idx) => `
                                    <div class="col-md-6">
                                        <div class="card source-card h-100">
                                            <div class="card-body">
                                                <div class="d-flex justify-content-between align-items-start mb-2">
                                                    <span class="badge badge-custom ${getSourceTypeBadgeClass(source.type)}">
                                                        ${escapeHtml(source.type)}
                                                    </span>
                                                    <small class="text-muted">${formatLength(source.length)}</small>
                                                </div>
                                                <h6 class="card-title">${escapeHtml(source.title)}</h6>
                                                <a href="${escapeHtml(source.url)}" target="_blank" class="card-link small" style="word-break: break-all;">
                                                    <i class="bi bi-box-arrow-up-right"></i> ${escapeHtml(truncateUrl(source.url))}
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // Raw Results (internal mode)
            if (result.raw_results && result.raw_results.length > 0) {
                html += `
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-code-square text-warning"></i> Raw Results
                            </h5>
                            <div class="accordion" id="rawResultsAccordion">
                                ${result.raw_results.map((item, idx) => `
                                    <div class="accordion-item">
                                        <h2 class="accordion-header">
                                            <button class="accordion-button ${idx !== 0 ? 'collapsed' : ''}" type="button" 
                                                    data-bs-toggle="collapse" data-bs-target="#collapse${idx}">
                                                Result ${idx + 1}: ${escapeHtml(item.title || item.url || 'Untitled')}
                                            </button>
                                        </h2>
                                        <div id="collapse${idx}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" 
                                             data-bs-parent="#rawResultsAccordion">
                                            <div class="accordion-body">
                                                <pre style="white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(JSON.stringify(item, null, 2))}</pre>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // Utility functions
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getConfidenceBadgeClass(confidence) {
            const conf = confidence.toLowerCase();
            if (conf === 'high') return 'bg-success';
            if (conf === 'medium') return 'bg-warning';
            return 'bg-secondary';
        }

        function getSourceTypeBadgeClass(type) {
            const t = type.toLowerCase();
            if (t === 'local_db') return 'bg-primary';
            if (t === 'web') return 'bg-info';
            if (t === 'pdf') return 'bg-danger';
            return 'bg-secondary';
        }

        function formatLength(length) {
            if (!length) return '';
            if (length < 1000) return `${length} chars`;
            return `${(length / 1000).toFixed(1)}K chars`;
        }

        function truncateUrl(url, maxLength = 50) {
            if (!url || url.length <= maxLength) return url;
            return url.substring(0, maxLength) + '...';
        }
    </script>
</body>
</html>
